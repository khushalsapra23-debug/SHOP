<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Private Shop Tracker</title><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#2f5bea"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#eef1f6;--cd:#fff;--tx:#161b22;--mu:#6b7280;--bd:#e2e6ec;--ac:#2f5bea;--ac2:#6a8cff;--g:#0f9f55;--gb:#e3f6ec;--r:#d63b3b;--rb:#fde8e8;--sh:0 2px 8px rgba(20,30,60,.07);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1117;--cd:#171d26;--tx:#e8ecf2;--mu:#98a2b0;--bd:#262f3b;--ac:#5a82ff;--ac2:#7c9bff;--g:#4ade80;--gb:#12301f;--r:#ff7b7b;--rb:#3a1a1a;--sh:none;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1117;--cd:#171d26;--tx:#e8ecf2;--mu:#98a2b0;--bd:#262f3b;--ac:#5a82ff;--ac2:#7c9bff;--g:#4ade80;--gb:#12301f;--r:#ff7b7b;--rb:#3a1a1a;--sh:none;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.w{max-width:640px;margin:0 auto;padding:0 14px calc(96px + env(safe-area-inset-bottom,0px))}
.top{display:flex;align-items:center;gap:12px;padding:14px 0}.top h1{font-size:22px;margin:0;flex:1}
.ic{background:var(--cd);color:var(--tx);border:1px solid var(--bd);width:44px;height:44px;font-size:22px;padding:0;border-radius:12px;box-shadow:var(--sh)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20}
.dr{position:fixed;top:0;left:0;bottom:0;width:270px;background:var(--cd);z-index:21;padding:calc(22px + env(safe-area-inset-top,0px)) 14px 20px;box-shadow:4px 0 24px rgba(0,0,0,.3)}
.dr h2{margin:0 0 18px;font-size:20px}.dr button{display:flex;gap:12px;width:100%;text-align:left;background:transparent;color:var(--tx);padding:14px 12px;margin-bottom:6px;border-radius:12px;font-size:17px}
.dr button.on{background:var(--ac);color:#fff}
.tb{position:fixed;left:0;right:0;bottom:0;background:var(--cd);border-top:1px solid var(--bd);display:flex;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:10}
.tb button{flex:1;background:transparent;color:var(--mu);padding:6px 0;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px;border-radius:10px}.tb button span{font-size:22px}.tb button.on{color:var(--ac);font-weight:600}
.cd{background:var(--cd);border:1px solid var(--bd);border-radius:16px;padding:16px;margin:12px 0;box-shadow:var(--sh)}h3{margin:0 0 10px;font-size:17px}
.hero{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border-radius:20px;padding:20px;box-shadow:var(--sh)}.hero small{opacity:.9;display:block}.hero b{display:block;font-size:34px;margin:2px 0}
.gr{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}
.k{background:var(--cd);border:1px solid var(--bd);border-radius:16px;padding:14px;box-shadow:var(--sh)}.k small{color:var(--mu);display:block;font-size:13px}.k b{font-size:20px;display:block;margin:2px 0}.k i{font-style:normal;color:var(--mu);font-size:12px}
.g{color:var(--g)}.r{color:var(--r)}.mu{color:var(--mu);font-size:14px}
.chip{display:inline-block;border-radius:20px;padding:3px 10px;font-size:13px;font-weight:600;background:var(--bg)}.chip.g{background:var(--gb)}.chip.r{background:var(--rb)}
input,select,textarea{width:100%;padding:13px;border:1px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx);font:inherit;margin:5px 0}
label{font-size:13px;color:var(--mu);display:block;margin-top:6px}
button{padding:13px 16px;border:0;border-radius:12px;background:var(--ac);color:#fff;font:inherit;font-weight:600;cursor:pointer}button.s{background:transparent;color:var(--ac);border:1px solid var(--bd)}button.x{background:transparent;color:var(--r);padding:4px 8px}button.dg{background:var(--r);width:100%;margin-top:6px}
.rw{display:flex;gap:10px}.rw>div{flex:1}.h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.seg{display:flex;gap:8px;margin:6px 0}.seg button{flex:1;background:var(--bg);color:var(--tx);border:1px solid var(--bd)}.seg button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.ln{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-top:1px solid var(--bd);font-size:14px;gap:8px}
#lk{max-width:380px;margin:12vh auto}
#ts{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:12px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30;max-width:90%;text-align:center}#ts.show{opacity:1}
</style></head><body><div class="w" id="app"></div>
<script>
const $=id=>document.getElementById(id),app=$('app'),K='stk_vault_v1',enc=new TextEncoder(),dec=new TextDecoder();
let U='',KU='',lm='in',key=null,salt=null,S={items:[],sales:[]},V='dash',menu=false,sel='',pd='',mode='cash',cart=[],cust='',ed='',eb=-1,ebd=null,dd='';
const TT={dash:'Dashboard',items:'Items',bill:'Billing',sell:'Sell',admin:'Admin'},IC={dash:'📊',items:'📦',bill:'🧾',sell:'💰',admin:'⚙️'},TABS=['dash','items','bill','sell','admin'];
const uid=()=>Math.random().toString(36).slice(2,9);
const b64=a=>btoa(String.fromCharCode(...new Uint8Array(a))),ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const R=n=>(n<0?'−':'')+'₹'+Math.abs(n).toLocaleString('en-IN',{maximumFractionDigits:2});
const cls=n=>n>0.004?'g':n<-0.004?'r':'';
const dt=d=>new Date(d).toLocaleDateString('en-IN'),rd=n=>Math.round(n*1e6)/1e6;
const vk=u=>'stk_u_'+encodeURIComponent(u.trim().toLowerCase()),get=(k=KU)=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}};
if(localStorage.getItem(K)&&!localStorage.getItem(vk('myshop'))){try{localStorage.setItem(vk('myshop'),localStorage.getItem(K));localStorage.removeItem(K);localStorage.setItem('stk_note','1')}catch(e){}}
function mig(o){if(!o.stocks)return o;const items=[],sales=[];o.stocks.forEach(s=>{let bq=0,bc=0;s.buys.forEach(b=>{bq+=b.q;bc+=b.q*b.p});const id=uid();items.push({id,name:s.name,q:bq,p:bq?bc/bq:0,d:s.buys[0]?s.buys[0].d:Date.now()});s.sells.forEach(x=>sales.push({d:x.d,m:x.m==='online'?'online':'cash',lines:[{id,q:x.q,p:x.p}]}))});sales.sort((a,b)=>a.d-b.d);return{items,sales}}
function toast(t){let e=$('ts');if(!e){e=document.createElement('div');e.id='ts';document.body.appendChild(e)}e.textContent=t;e.className='show';clearTimeout(window._t);window._t=setTimeout(()=>e.className='',2800)}
async function mk(pw,sl){const m=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);
return crypto.subtle.deriveKey({name:'PBKDF2',salt:sl,iterations:250000,hash:'SHA-256'},m,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function save(){const iv=crypto.getRandomValues(new Uint8Array(12));
const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,enc.encode(JSON.stringify(S)));
try{localStorage.setItem(KU,JSON.stringify({s:b64(salt),i:b64(iv),d:b64(ct)}))}catch(e){toast('Could not save in this browser.')}}
function lock(){U='';KU='';key=null;S={items:[],sales:[]};cart=[];cust='';menu=false;V='dash';lockUI()}
function lockUI(){const note=localStorage.getItem('stk_note')?'<p class="mu">Your earlier data is saved under the username <b>myshop</b>.</p>':'';
app.innerHTML=`<div id="lk" class="cd"><h1>🛒 Shop Tracker</h1><div class="seg"><button class="${lm==='in'?'on':''}" onclick="lm='in';lockUI()">Login</button><button class="${lm==='up'?'on':''}" onclick="lm='up';lockUI()">Create account</button></div>${note}
<input id="u1" placeholder="Username (your shop name)" autocapitalize="none" autocomplete="username"><input id="p1" type="password" placeholder="Password" autocomplete="${lm==='in'?'current-password':'new-password'}">${lm==='up'?'<input id="p2" type="password" placeholder="Confirm password" autocomplete="new-password"><p class="mu">Your data is encrypted with your password. If you forget it, it cannot be recovered.</p>':''}
<p id="er" class="r"></p><button id="go" style="width:100%">${lm==='in'?'Login':'Create account'}</button>
<details style="margin-top:12px"><summary class="mu">Restore from backup</summary><textarea id="rb" rows="3" placeholder="Paste encrypted backup"></textarea><button class="s" id="rs">Restore</button></details></div>`;
const go=async()=>{const u=$('u1').value.trim(),pw=$('p1').value,er=$('er');er.textContent='';if(!u){er.textContent='Enter a username.';return}const k=vk(u),v=get(k);
if(lm==='in'){if(!v){er.textContent='Wrong username or password.';return}
try{const sl=ub(v.s),kk=await mk(pw,sl);const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(v.i)},kk,ub(v.d));key=kk;salt=sl;S=mig(JSON.parse(dec.decode(pt)));U=u;KU=k;if(k===vk('myshop'))localStorage.removeItem('stk_note');V='dash';render()}catch(e){er.textContent='Wrong username or password.'}}
else{if(v){er.textContent='This username is already taken.';return}if(pw.length<6){er.textContent='Use at least 6 characters.';return}if(pw!==$('p2').value){er.textContent='Passwords do not match.';return}
U=u;KU=k;salt=crypto.getRandomValues(new Uint8Array(16));key=await mk(pw,salt);S={items:[],sales:[]};await save();V='dash';render()}};
$('go').onclick=go;$('p1').onkeydown=e=>{if(e.key==='Enter'&&lm==='in')go()};
$('rs').onclick=()=>{try{const o=JSON.parse($('rb').value),n=(o.u||$('u1').value).trim();if(!o.s||!o.i||!o.d)throw 0;if(!n){$('er').textContent='Type the username above for this old backup.';return}
if(get(vk(n))){$('er').textContent='That username already exists here. Erase it first or use another name.';return}localStorage.setItem(vk(n),JSON.stringify({s:o.s,i:o.i,d:o.d}));lm='in';lockUI();$('u1').value=n;$('er').className='g';$('er').textContent='Backup restored. Login with your password.'}catch(e){$('er').textContent='Invalid backup.'}}}
const sold=id=>{let n=0;S.sales.forEach(b=>b.lines.forEach(l=>{if(l.id===id)n+=l.q}));return n};
const held=it=>rd(it.q-sold(it.id)),itm=id=>S.items.find(x=>x.id===id);
const avail=it=>rd(held(it)-cart.filter(c=>c.id===it.id).reduce((a,c)=>a+c.q,0));
const bill=b=>{let t=0,pr=0;b.lines.forEach(l=>{const it=itm(l.id);t+=l.q*l.p;pr+=l.q*(l.p-(it?it.p:0))});return{t,pr}};
const pad=n=>String(n).padStart(2,'0'),ymd=t=>{const d=new Date(t);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const payOf=b=>{if(b.pay)return b.pay;const t=bill(b).t;return b.m==='online'?{cash:0,online:t}:{cash:t,online:0}};
const payLabel=b=>{const p=payOf(b);return p.cash>0&&p.online>0?`💵 ${R(p.cash)} + 📱 ${R(p.online)}`:p.online>0?'📱 Online':'💵 Cash'};
const tm=()=>{menu=!menu;render()},go=v=>{V=v;menu=false;pd='';ed='';eb=-1;render();scrollTo(0,0)};
function render(){
const nav=menu?`<div class="ov" onclick="tm()"></div><nav class="dr"><h2>🏪 ${esc(U)}</h2>${TABS.map(x=>`<button class="${V===x?'on':''}" onclick="go('${x}')"><span>${IC[x]}</span>${TT[x]}</button>`).join('')}<button onclick="lock()"><span>🔒</span>Lock</button></nav>`:'';
const tb=`<div class="tb">${TABS.map(x=>`<button class="${V===x?'on':''}" onclick="go('${x}')"><span>${IC[x]}</span>${TT[x]}</button>`).join('')}</div>`;
app.innerHTML=`<div class="top"><button class="ic" onclick="tm()" aria-label="Menu">☰</button><div style="flex:1"><h1>${TT[V]}</h1><small class="mu">🏪 ${esc(U)}</small></div></div>${nav}`+({dash:dashV,items:itemsV,bill:billV,sell:sellV,admin:adminV}[V])()+tb}
function dashV(){let inv=0,cash=0,onl=0;S.items.forEach(it=>inv+=it.q*it.p);S.sales.forEach(b=>{const p=payOf(b);cash+=p.cash;onl+=p.online});if(!dd)dd=ymd(Date.now());let de=0,dc=0,dp=0,dk=0,dn=0,dm=0;S.sales.forEach(b=>{if(ymd(b.d)!==dd)return;const x=bill(b),p=payOf(b);dm++;de+=x.t;dp+=x.pr;dc+=x.t-x.pr;dk+=p.cash;dn+=p.online});
const tot=cash+onl,ov=tot-inv;
return `<div class="hero"><small>Overall profit or loss</small><b>${ov>0.004?'+':''}${R(ov)}</b><small>${ov>0.004?'In profit 🎉':ov<-0.004?'Stock cost not fully recovered yet':inv?'Cost recovered. Break-even':'Add items to begin'} · Recovered ${R(tot)} of ${R(inv)}</small></div>
<div class="gr"><div class="k"><small>💼 Money invested</small><b>${R(inv)}</b><i>Total cost of all items bought</i></div>
<div class="k"><small>🧾 Total money</small><b>${R(tot)}</b><i>Cash + Online</i></div>
<div class="k"><small>💵 Cash money</small><b>${R(cash)}</b><i>Received in cash</i></div>
<div class="k"><small>📱 Online money</small><b>${R(onl)}</b><i>Received online</i></div></div>
<div class="cd"><h3>📅 Daily report</h3><label>Choose date</label><input type="date" value="${dd}" onchange="dd=this.value||ymd(Date.now());render()"><div class="gr" style="margin-top:6px"><div class="k"><small>💰 Earning (sales)</small><b>${R(de)}</b><i>${dm} bill${dm==1?'':'s'} on this day</i></div><div class="k"><small>💼 Investment on sold items</small><b>${R(dc)}</b><i>Purchase cost of what was sold</i></div><div class="k"><small>📈 Profit of the day</small><b class="${cls(dp)}">${R(dp)}</b><i>Earning − investment</i></div><div class="k"><small>🧾 Total received</small><b>${R(dk+dn)}</b><i>Cash + Online</i></div><div class="k"><small>💵 Cash received</small><b>${R(dk)}</b></div><div class="k"><small>📱 Online received</small><b>${R(dn)}</b></div></div></div>`}
function itemsV(){return `<div class="cd"><h3>Add an item</h3><label>Item name</label><input id="nn" placeholder="e.g. Rice 1 kg"><div class="rw"><div><label>Quantity</label><input id="nq" type="number" step="any" min="0" placeholder="0"></div><div><label>Purchase price (each)</label><input id="np" type="number" step="any" min="0" placeholder="₹"></div></div><button style="width:100%;margin-top:10px" onclick="addI()">Add item</button></div>
<h3 style="margin:20px 0 0">Items in shop</h3>${S.items.map(it=>ed===it.id?editI(it):`<div class="cd"><div class="h"><h3 style="margin:0">${esc(it.name)}</h3><span><button class="x" style="color:var(--ac)" onclick="ed='${it.id}';render()">Edit</button><button class="x" onclick="del('i${it.id}')">${pd==='i'+it.id?'Tap again to delete':'Delete'}</button></span></div>
<p style="margin:8px 0 0"><span class="chip">Bought: ${it.q}</span> <span class="chip">Purchase price: ${R(it.p)}</span> <span class="chip ${held(it)>0?'':'r'}">In stock: ${held(it)}</span></p></div>`).join('')||'<div class="cd mu">No items yet.</div>'}`}
function billV(){const av=S.items.filter(it=>avail(it)>0);if(!av.some(x=>x.id===sel))sel=av.length?av[0].id:'';
const cur=itm(sel),b={lines:cart},bb=bill(b);
return (S.items.length?`<div class="cd"><h3>New bill</h3><label>Customer name (optional)</label><input id="cn" value="${esc(cust)}" oninput="cust=this.value" placeholder="e.g. Ramesh">${av.length?`<label>Choose item</label><select onchange="sel=this.value;render()">${av.map(x=>`<option value="${x.id}" ${x.id===sel?'selected':''}>${esc(x.name)}</option>`).join('')}</select>
<div class="rw"><div><label>Quantity</label><input id="sq" type="number" step="any" min="0" placeholder="0"></div><div><label>Selling price (each)</label><input id="sp" type="number" step="any" min="0" placeholder="₹"></div></div>
<button class="s" style="width:100%" onclick="addC()">+ Add to bill</button>`:'<p class="mu">No more stock available to add.</p>'}
${cart.length?`<div style="margin-top:12px"><b>Items in this bill</b>${cart.map((c,n)=>`<div class="ln"><span>${esc(itm(c.id).name)} · ${c.q} × ${R(c.p)}</span><span>${R(c.q*c.p)} <button class="x" onclick="cart.splice(${n},1);render()">✕</button></span></div>`).join('')}
<div class="ln"><b>Bill total</b><b>${R(bb.t)}</b></div>
<label>Mode of payment</label><div class="seg"><button class="${mode==='cash'?'on':''}" onclick="setM('cash')">💵 Cash</button><button class="${mode==='online'?'on':''}" onclick="setM('online')">📱 Online</button><button class="${mode==='split'?'on':''}" onclick="setM('split')">➗ Split</button></div>${mode==='split'?`<div class="rw"><div><label>Cash received</label><input id="sc" oninput="remN()" type="number" step="any" min="0" placeholder="₹"></div><div><label>Online received</label><input id="so" oninput="remN()" type="number" step="any" min="0" placeholder="₹"></div></div><p id="rem" class="mu">Bill total ${R(bb.t)}</p>`:''}
<button style="width:100%;margin-top:6px" onclick="done()">Complete sale</button></div>`:''}</div>`:'<div class="cd mu">No items yet. Add items from the Items tab.</div>')}
function sellV(){let tot=0,pr=0;const cm={};
S.sales.forEach(b=>{const x=bill(b),n=(b.c||'').trim()||'Walk-in customer',k=n.toLowerCase();tot+=x.t;pr+=x.pr;const o=cm[k]||(cm[k]={n,b:0,t:0,p:0});o.b++;o.t+=x.t;o.p+=x.pr});
const cs=Object.values(cm).sort((a,b)=>b.t-a.t),hist=S.sales.map((b,i)=>({b,i})).sort((a,c)=>c.b.d-a.b.d);
return `<div class="gr" style="margin-top:0"><div class="k"><small>🧾 Total sales</small><b>${R(tot)}</b><i>${S.sales.length} bill${S.sales.length==1?'':'s'}</i></div><div class="k"><small>📈 Profit from sales</small><b class="${cls(pr)}">${R(pr)}</b><i>Selling − purchase price</i></div></div>
<h3 style="margin:20px 0 0">Profit by customer</h3>${cs.map(c=>`<div class="cd"><div class="h"><b>${esc(c.n)}</b><span class="chip ${cls(c.p)}">${c.p>=0?'Profit ':'Loss '}${R(Math.abs(c.p))}</span></div><div class="ln"><span>${c.b} bill${c.b>1?'s':''}</span><span>Total ${R(c.t)}</span></div></div>`).join('')||'<div class="cd mu">No sales yet.</div>'}
<h3 style="margin:20px 0 0">Sales history</h3>${hist.map(({b,i})=>{if(eb===i)return editB();const x=bill(b),k='b'+i;return `<div class="cd"><div class="h"><b>${esc((b.c||'').trim()||'Walk-in customer')}</b><span class="chip ${cls(x.pr)}">${x.pr>=0?'Profit ':'Loss '}${R(Math.abs(x.pr))}</span></div><div class="mu">${dt(b.d)} · ${payLabel(b)}</div>
${b.lines.map(l=>`<div class="ln"><span>${esc(itm(l.id)?itm(l.id).name:'Item')} · ${l.q} × ${R(l.p)}</span><span>${R(l.q*l.p)}</span></div>`).join('')}
<div class="ln"><b>Total ${R(x.t)}</b><span><button class="x" style="color:var(--ac)" onclick="stE(${i})">Edit</button><button class="x" onclick="del('${k}')">${pd===k?'Tap again to delete':'Delete bill'}</button></span></div></div>`}).join('')||'<div class="cd mu">No sales yet.</div>'}`}
function adminV(){return `<div class="cd"><h3>🔑 Change password</h3><input id="pw0" type="password" placeholder="Current password" autocomplete="current-password"><input id="pw1" type="password" placeholder="New password (6+ characters)" autocomplete="new-password"><input id="pw2" type="password" placeholder="Confirm new password" autocomplete="new-password"><button style="width:100%;margin-top:6px" onclick="chPw()">Change password</button></div>
<div class="cd"><h3>💾 Backup of all data</h3><p class="mu">All your stocks and sales in one encrypted text. Keep it safe. You can restore it from the lock screen.</p><textarea id="bk" rows="4" readonly onclick="this.select()">${esc(JSON.stringify(Object.assign({u:U},get())))}</textarea><button style="width:100%;margin-top:6px" onclick="cpBk()">Copy backup</button></div>
<div class="cd"><h3>🗑️ Erase all data</h3><p class="mu">Deletes this account (<b>${esc(U)}</b>): every item, every sale and its password from this browser. Other accounts are not touched. This cannot be undone. Copy a backup first if unsure.</p><input id="er" placeholder="Type ERASE to confirm"><button class="dg" onclick="erase()">Erase everything</button></div>`}
const setM=m=>{mode=m;const q=$('sq')?$('sq').value:'',p=$('sp')?$('sp').value:'';render();if($('sq')){$('sq').value=q;$('sp').value=p}};
function editI(it){return `<div class="cd"><h3>Edit item</h3><label>Item name</label><input id="en" value="${esc(it.name)}"><div class="rw"><div><label>Quantity bought</label><input id="eq" type="number" step="any" min="0" value="${it.q}"></div><div><label>Purchase price (each)</label><input id="ep" type="number" step="any" min="0" value="${it.p}"></div></div><p class="mu">${sold(it.id)} already sold.</p><div class="rw" style="margin-top:6px"><button class="s" style="flex:1" onclick="ed='';render()">Cancel</button><button style="flex:1" onclick="saveI()">Save</button></div></div>`}
async function saveI(){const it=itm(ed),n=$('en').value.trim(),q=parseFloat($('eq').value),p=parseFloat($('ep').value);
if(!n||!(q>0)||isNaN(p)||p<0){toast('Enter name, quantity and purchase price.');return}
if(q<sold(it.id)){toast('Quantity cannot be less than '+sold(it.id)+' already sold.');return}
it.name=n;it.q=q;it.p=p;ed='';await save();render();toast('Item updated ✓')}
function stE(i){eb=i;ebd=JSON.parse(JSON.stringify(S.sales[i]));if(!ebd.c)ebd.c='';const p=payOf(S.sales[i]);ebd.pm=p.cash>0&&p.online>0?'split':p.online>0?'online':'cash';ebd.pc=p.cash;ebd.po=p.online;ebd.ds=ymd(ebd.d);render()}
function editB(){const pb=(k,t)=>`<button class="${ebd.pm===k?'on':''}" onclick="ebd.pm='${k}';render()">${t}</button>`;
return `<div class="cd"><h3>Edit bill</h3><label>Customer name</label><input value="${esc(ebd.c)}" oninput="ebd.c=this.value" placeholder="Walk-in customer"><label>Date of bill</label><input type="date" value="${ebd.ds}" onchange="ebd.ds=this.value">
${ebd.lines.map((l,n)=>`<div style="margin-top:10px"><div class="h"><b>${esc(itm(l.id)?itm(l.id).name:'Item')}</b><button class="x" onclick="ebd.lines.splice(${n},1);render()">✕</button></div><div class="rw"><div><label>Quantity</label><input type="number" step="any" min="0" value="${l.q}" oninput="ebd.lines[${n}].q=this.value"></div><div><label>Selling price (each)</label><input type="number" step="any" min="0" value="${l.p}" oninput="ebd.lines[${n}].p=this.value"></div></div></div>`).join('')}
${S.items.length?`<div class="cd" style="margin:12px 0;background:var(--bg)"><b>Add another item to this bill</b><select id="ai">${S.items.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select><div class="rw"><div><input id="aq" type="number" step="any" min="0" placeholder="Quantity"></div><div><input id="ap" type="number" step="any" min="0" placeholder="Selling price ₹"></div></div><button class="s" style="width:100%;margin-top:6px" onclick="addE()">+ Add to this bill</button></div>`:''}
<label>Mode of payment</label><div class="seg">${pb('cash','💵 Cash')}${pb('online','📱 Online')}${pb('split','➗ Split')}</div>
${ebd.pm==='split'?`<div class="rw"><div><label>Cash received</label><input type="number" step="any" min="0" value="${ebd.pc}" oninput="ebd.pc=this.value"></div><div><label>Online received</label><input type="number" step="any" min="0" value="${ebd.po}" oninput="ebd.po=this.value"></div></div><p class="mu">Cash + Online must equal the bill total.</p>`:''}
<div class="rw" style="margin-top:8px"><button class="s" style="flex:1" onclick="eb=-1;render()">Cancel</button><button style="flex:1" onclick="saveB()">Save</button></div></div>`}
function addE(){const id=$('ai').value,q=parseFloat($('aq').value),p=parseFloat($('ap').value);if(!id||!(q>0)||isNaN(p)||p<0){toast('Choose an item and enter quantity and price.');return}ebd.lines.push({id,q:String(q),p:String(p)});render()}
async function saveB(){const lines=[];for(const l of ebd.lines){const q=parseFloat(l.q),p=parseFloat(l.p);if(!(q>0)||isNaN(p)||p<0){toast('Enter a valid quantity and price for every item.');return}lines.push({id:l.id,q,p})}
if(!lines.length){toast('A bill needs at least one item. Delete the bill instead.');return}
const use={};S.sales.forEach((b,i)=>{if(i!==eb)b.lines.forEach(l=>use[l.id]=(use[l.id]||0)+l.q)});lines.forEach(l=>use[l.id]=(use[l.id]||0)+l.q);
for(const id in use){const it=itm(id);if(it&&use[id]>it.q+1e-9){toast('Not enough stock of '+it.name+'.');return}}
const t=lines.reduce((a,l)=>a+l.q*l.p,0);let pay;
if(ebd.pm==='split'){const c=parseFloat(ebd.pc)||0,o=parseFloat(ebd.po)||0;if(c<0||o<0||Math.abs(c+o-t)>0.005){toast('Cash + Online must equal the bill total '+R(t)+'.');return}pay={cash:c,online:o}}
else pay=ebd.pm==='online'?{cash:0,online:t}:{cash:t,online:0};
let nd=ebd.d;if(ebd.ds){const [y,m,d]=ebd.ds.split('-').map(Number),o=new Date(ebd.d);nd=new Date(y,m-1,d,o.getHours(),o.getMinutes()).getTime()}
S.sales[eb]={d:nd,m:ebd.pm==='online'?'online':'cash',c:(ebd.c||'').trim(),pay,lines};eb=-1;ebd=null;await save();render();toast('Bill updated ✓')}
async function addI(){const n=$('nn').value.trim(),q=parseFloat($('nq').value),p=parseFloat($('np').value);if(!n||!(q>0)||isNaN(p)||p<0){toast('Enter name, quantity and purchase price.');return}S.items.push({id:uid(),name:n,q,p,d:Date.now()});await save();render()}
function addC(){const it=itm(sel),q=parseFloat($('sq').value),p=parseFloat($('sp').value);
if(!(q>0)||isNaN(p)||p<0){toast('Enter quantity and selling price.');return}if(q>avail(it)){toast('Only '+avail(it)+' available.');return}
cart.push({id:sel,q,p});render()}
function remN(){const t=bill({lines:cart}).t,c=parseFloat($('sc').value)||0,o=parseFloat($('so').value)||0,r=t-c-o;$('rem').textContent=Math.abs(r)<0.005?'Matches the bill total ✓':(r>0?'Still to receive: ':'Received too much by: ')+R(Math.abs(r))}
async function done(){if(!cart.length)return;const t=bill({lines:cart}).t;let pay;
if(mode==='split'){const c=parseFloat($('sc').value)||0,o=parseFloat($('so').value)||0;if(c<0||o<0||Math.abs(c+o-t)>0.005){toast('Cash + Online must equal the bill total '+R(t)+'.');return}pay={cash:c,online:o}}
else pay=mode==='online'?{cash:0,online:t}:{cash:t,online:0};
S.sales.push({d:Date.now(),m:mode==='online'?'online':'cash',c:cust.trim(),pay,lines:cart.map(c=>({id:c.id,q:c.q,p:c.p}))});cart=[];cust='';await save();render();toast('Sale completed ✓')}
async function del(k){if(pd!==k){pd=k;render();return}pd='';
if(k[0]==='i'){const id=k.slice(1);S.items=S.items.filter(x=>x.id!==id);S.sales.forEach(b=>b.lines=b.lines.filter(l=>l.id!==id));S.sales=S.sales.filter(b=>b.lines.length);cart=cart.filter(c=>c.id!==id)}else S.sales.splice(+k.slice(1),1);
await save();render()}
async function chPw(){const c=$('pw0').value,n=$('pw1').value,n2=$('pw2').value,v=get();
try{await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(v.i)},await mk(c,ub(v.s)),ub(v.d))}catch(e){toast('Current password is wrong.');return}
if(n.length<6){toast('New password needs 6+ characters.');return}if(n!==n2){toast('New passwords do not match.');return}
salt=crypto.getRandomValues(new Uint8Array(16));key=await mk(n,salt);await save();render();toast('Password changed ✓')}
async function cpBk(){const t=$('bk');t.select();try{await navigator.clipboard.writeText(t.value);toast('Backup copied ✓')}catch(e){try{document.execCommand('copy');toast('Backup copied ✓')}catch(e2){toast('Text selected. Copy it manually.')}}}
function erase(){if($('er').value.trim()!=='ERASE'){toast('Type ERASE to confirm.');return}try{localStorage.removeItem(KU)}catch(e){}lock()}
lockUI();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
